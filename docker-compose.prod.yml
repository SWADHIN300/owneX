services:
  platform:
    build:
      context: ./apps/platform
    image: ownex/platform:latest
    ports:
      - "3000:3000"
    env_file:
      - ./apps/platform/.env.local
    restart: unless-stopped

  employee-portal:
    build:
      context: ./apps/employee-portal
    image: ownex/employee-portal:latest
    ports:
      - "3001:3001"
    env_file:
      - ./apps/employee-portal/.env.local
    restart: unless-stopped
